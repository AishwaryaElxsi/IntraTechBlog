version: '3.9'
services:
  frontend:
    build: ./frontend
    container_name: intratech_frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_SSO_CLIENT_ID=sample-client-id
      - REACT_APP_SSO_ISSUER=https://company-sso.example.com
    ports:
      - "3000:3000"
